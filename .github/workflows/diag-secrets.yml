name: diag-secrets

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Dump ALL env
        run: env | sort
      - name: Dump secrets to artifact
        run: env | sort > full_env.txt
      - uses: actions/upload-artifact@v4
        with:
          name: env-dump
          path: full_env.txt
